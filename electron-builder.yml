appId: com.wordelia.app
productName: Wordelia
copyright: Copyright © 2026 Lorenzo Aceti
directories:
  output: release
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: Wordelia-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Wordelia
  uninstallDisplayName: Wordelia
mac:
  target: dmg
  category: public.app-category.productivity
linux:
  target: AppImage
  category: Office
npmRebuild: false
